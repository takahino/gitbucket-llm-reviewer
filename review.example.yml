# =============================================================================
# .review.yml サンプル設定
#
# このファイルをコピーし、レビュー対象リポジトリの「ルート」に ".review.yml" として配置する。
# サブフォルダに置いても読み込まれない(モノレポでフォルダ毎に観点を分けたい場合は
# 下記の paths: を使うこと。ルート以外に置いた .review.yml 自体は無視される)。
#
# 重要: このファイルが存在しない、または YAML として解析できない場合、あるいは
# perspectives が実質0件に解決される場合は、そのリポジトリのレビュー自体が
# スキップされる(デフォルト観点にフォールバックすることはない)。
# つまり観点を明示的に設定したリポジトリだけがレビュー対象になる。
# =============================================================================

# レビューコメント(サマリ・指摘事項)を書く言語。省略時は "ja"。
# 現状の実装は日本語プロンプト前提のため、変更しても英語などへ完全には切り替わらない点に注意。
language: ja

# ---------------------------------------------------------------------------
# perspectives: リポジトリ全体(共通)に適用する観点の一覧。
#
# ここに書いた各項目が、LLMへの指示として「## レビュー観点」セクションに列挙され、
# LLMはこの観点に沿って指摘(findings)を生成する。何を書いても自由な自然文でよい
# (「〜がないか確認して」のような指示文でも、「〜の妥当性」のような名詞句でもよい)。
#
# 各要素は次の2通りの書き方ができる(混在可):
#   1. スカラー文字列 … 観点のテキストのみ。追加コンテキストは渡さない。
#   2. マッピング形式 … perspective: に観点テキスト、context: に
#      .review/ フォルダ配下の追加コンテキストファイル(Markdown)を指定できる。
#      指定したファイルは、この観点が適用されるレビューの際に毎回全文がそのまま
#      LLMへ渡される(後述の knowledgeBase のようなベクトル検索を介さない)。
# ---------------------------------------------------------------------------
perspectives:
  - "セキュリティ(インジェクション、認可漏れ)"
  - "既存コードとの命名・設計の一貫性"
  - perspective: "独自DSLのバリデーションルール整合性"   # 観点テキスト(スカラー形式の値に相当)
    context:                                            # .review/ 配下のファイルを指定(任意、複数可)
      - "dsl/spec.md"                                  # 実際に読み込まれるのは .review/dsl/spec.md
      - "must-follow/security-checklist.md"             # .review/ 配下はサブフォルダで自由に分類してよい

# ---------------------------------------------------------------------------
# paths: モノレポ対応。フォルダ(globパターン)毎に観点・コーディング規約を追加する。
#
# キーは Java の PathMatcher (glob:) 構文で変更ファイルのパスに対してマッチ判定される。
# 変更ファイル群のうち、いずれかの glob にマッチしたファイルには、その glob 配下の
# perspectives が「追加」される(共通の perspectives を置き換えるのではなく、
# デフォルトでは共通観点 + glob固有観点の両方が適用される)。
# glob にマッチしなかったファイルには共通 perspectives のみが適用される。
# ---------------------------------------------------------------------------
paths:
  "frontend/**":
    perspectives:                       # このglobにマッチしたファイルにのみ追加される観点
      - "React hooksの依存配列漏れ"
      - "XSS(dangerouslySetInnerHTML等)"
      # ここもスカラー文字列/オブジェクト形式(perspective + context)のどちらも使える
    inherit: true                       # 共通の perspectives / knowledgeBase も併せて適用する(デフォルトtrue)
    knowledgeBase:                      # このglob配下にのみ追加されるRAG検索対象規約文書(任意)
      - "frontend/docs/coding-standards.md"
  "backend/**":
    perspectives:
      - "トランザクション境界の妥当性"
      - "N+1クエリ"
    # inherit を書かない場合はデフォルトの true。false にすると、このglobにマッチした
    # ファイルには共通観点(perspectives)・共通knowledgeBaseが一切適用されず、
    # このglob固有の設定のみが使われる。
    knowledgeBase:
      - "backend/docs/coding-standards.md"

# ---------------------------------------------------------------------------
# exclude: diff(レビュー対象の変更内容)から除外するファイルのglob一覧。
# ビルド生成物・minify済みファイル・ロックファイルなど、レビューしても意味が薄い
# ファイルを除外するのに使う。ここで除外したファイルは perspectives の
# 共通/パス別マッチングの対象からも外れる(=そもそも変更ファイル一覧に現れない)。
# ---------------------------------------------------------------------------
exclude:
  - "**/*.min.js"
  # - "package-lock.json"
  # - "**/*.generated.ts"

# ---------------------------------------------------------------------------
# contextFiles: 観点やNパス(need_more_context)の申告を待たずに、
# 毎回のレビューで無条件にLLMへ全文を渡すファイル(任意)。
# README等、リポジトリの前提知識として常に持たせておきたいファイルに使う。
# perspectives[].context と異なり特定の観点に紐づかず、レビュー全体に対して渡される。
# ---------------------------------------------------------------------------
contextFiles:
  - "README.md"

# ---------------------------------------------------------------------------
# knowledgeBase: RAG(ベクトル検索)によるコンテキスト拡張の対象とする、
# リポジトリ共通のコーディング規約文書パス(任意)。
# config.yml 側で rag.enabled: true になっている場合のみ使用され、diffの内容に
# 類似度が高いチャンクだけが「参考情報」として自動抽出される(全文は渡らない)。
# rag.enabled: false の場合、この項目は単に無視される。
# perspectives[].context(常に全文をそのまま渡す)や contextFiles とは仕組みが異なる点に注意。
# ---------------------------------------------------------------------------
knowledgeBase:
  - "docs/coding-standards.md"

# ---------------------------------------------------------------------------
# maxComments: PRコメントに"表示"する指摘事項(findings)の最大件数。省略時は10。
#
# 注意: LLMが検出する指摘の件数そのものを制限するものではない。LLMは通常どおり
# 全ての指摘を生成し、そのうち先頭から maxComments 件だけがPRコメント本文に
# 列挙される。超過分は本文末尾に「(他N件の指摘は表示上限のため省略されました)」
# という注記が付くだけで、実際にはLLMがそれ以上検出している場合がある。
# コメントが長大になりすぎて読みにくくなるのを防ぐための表示上の上限。
# ---------------------------------------------------------------------------
maxComments: 10

# =============================================================================
# .review/ フォルダ(このファイルと同階層)について
#
# 上記 perspectives(および paths.<glob>.perspectives)の context で参照する
# Markdownファイルを置く場所。ドメイン知識・アーキテクチャ・独自DSL知識・
# 独自コーディングルール・厳守事項など、観点ごとに参照させたいコンテキストを、
# 用途別のサブフォルダに分けて管理できる(サブフォルダの名前・階層は自由)。
#
# 例:
#   .review.yml
#   .review/
#   ├── domain-knowledge/
#   │   └── payment-flow.md
#   ├── architecture/
#   │   └── overview.md
#   ├── dsl/
#   │   └── spec.md
#   ├── coding-rules/
#   │   └── naming.md
#   └── must-follow/
#       └── security-checklist.md
#
# knowledgeBase(RAGベクトル検索の対象)との違い:
#   knowledgeBase … diffとの類似度が高いチャンクだけを自動抽出して渡す(全文は渡らない、
#                   rag.enabled=true が前提)。
#   perspectives[].context … 検索を介さず、対応する観点が適用されるレビューでは
#                   毎回ファイル全文がそのままLLMへ渡される(rag.enabledの設定に関係なく動作)。
# 「この観点をチェックする際は必ずこの内容を踏まえてほしい」という、抜け漏れを
# 許容したくない厳守事項・仕様書のようなドキュメントに向く。
# =============================================================================
