name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build fat-jar
        run: mvn -B package

      - name: Rename jar with version
        run: cp target/gitbucket-llm-reviewer.jar target/gitbucket-llm-reviewer-${{ github.ref_name }}.jar

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/gitbucket-llm-reviewer-${{ github.ref_name }}.jar
            config.example.yml
            review.example.yml
