# ハイスペック環境向けプリセット。RTX5090(VRAM 32GB)・RAM 128GB環境で
# Qwen3.6-35B-A3B(5bit量子化、ネイティブコンテキスト262,144トークン)を
# 運用する前提で、各種上限のデフォルト値を引き上げている。
# より非力な環境・小型モデルで運用する場合は config.example.yml をベースにすること。
gitbucket:
  baseUrl: http://localhost:8080
  token: "xxxxxxxx"
  gitUsername: ""     # JGit fetch用(任意。空ならtokenをBasic認証のusername/passwordとして試行)
  gitPassword: ""
repositories:
  - owner: root
    name: sample-repo
polling:
  intervalSeconds: 60
llm:
  baseUrl: http://localhost:11434/v1
  model: qwen2.5-coder:14b
  apiKey: ""          # LM Studio/vLLM等でAPIキーが必要な場合のみ設定
  temperature: 0.2
  maxTokens: 16384
  timeoutSeconds: 600
  retryMaxAttempts: 3   # LLM呼び出し失敗時の最大試行回数(初回含む)
  retryBackoffMs: 2000  # リトライ毎の待機時間(ミリ秒、指数的に増加)
review:
  maxDiffChars: 200000
  maxAdditionalFiles: 12
  maxFileChars: 80000
  maxPasses: 5
rag:
  enabled: false                        # trueにするとベクトル検索によるコンテキスト拡張を有効化
  embeddingProvider: ollama             # ollama | openai-compatible
  embeddingBaseUrl: http://localhost:11434
  embeddingModel: nomic-embed-text      # 事前に `ollama pull nomic-embed-text` 等で取得しておくこと
  embeddingApiKey: ""                   # openai-compatible時のみ
  topK: 10
  minScore: 0.65
  chunkSize: 1000
  chunkOverlap: 100
  maxIndexFiles: 10000
  includeExtensions: [".java", ".kt", ".ts", ".tsx", ".py", ".go", ".md"]
  indexDir: ./data/rag-index
state:
  filePath: ./data/review-state.json
workDir: ./data/repos
